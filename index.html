
<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Identificador de monuments de Lleida</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 15px;
  background: #111827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 { font-size: 23px; }

#videoContainer {
  position: relative;
  max-width: 650px;
  margin: auto;
}

video {
  width: 100%;
  border-radius: 12px;
}

button {
  padding: 13px 18px;
  margin: 8px;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

#start { background: #16a34a; color: white; }
#stop { background: #dc2626; color: white; }

#resultat {
  background: #1f2937;
  border-radius: 12px;
  padding: 15px;
  margin: 15px auto;
  max-width: 650px;
}

#referencia {
  width: 180px;
  max-width: 100%;
  border-radius: 10px;
  margin: 10px;
}

#estat { color: #93c5fd; }

</style>
</head>

<body>

<h1>🏛️ Identificador de monuments de Lleida</h1>

<p>Apunta la càmera als monuments per intentar identificar-los.</p>

<div id="estat">Carregant el model d'intel·ligència artificial...</div>

<div id="videoContainer">
  <video id="video" autoplay muted playsinline></video>
</div>

<button id="start" onclick="iniciar()">📷 Iniciar escàner</button>
<button id="stop" onclick="aturar()">Aturar</button>

<div id="resultat">
  <h2>Resultat de l'escaneig</h2>
  <p id="nom">Esperant detecció...</p>
  <img id="referencia" hidden>
  <p id="distancia"></p>
  <p id="similitud"></p>
</div>

<script>

// MONUMENTS I COORDENADES

const llocs = [
 {
  nom: "La Seu Vella",
  lat: 41.6174,
  lon: 0.6265,
  imatge: "https://upload.wikimedia.org/wikipedia/commons/e/ef/FP_Seu_Vella_2026_-_view_from_lift.jpg"
 },
 {
  nom: "El Castell del Rei (La Suda)",
  lat: 41.6185,
  lon: 0.6259,
  imatge: "https://upload.wikimedia.org/wikipedia/commons/a/ac/Lleida-14-1_Suda.jpg"
 },
 {
  nom: "La Catedral Nova",
  lat: 41.6129,
  lon: 0.6232,
  imatge: "https://upload.wikimedia.org/wikipedia/commons/b/ba/FP_Lleida_Cathedral_2026_-_Main_Fa%C3%A7ade.jpg"
 },
 {
  nom: "Castell Templer de Gardeny",
  lat: 41.6085,
  lon: 0.6149,
  imatge: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-C5F7DI4trDKLCNOWWAGFj8Htli3ONipb4rgLV4l5jg&s=10"
 },
 {
  nom: "Palau de la Paeria",
  lat: 41.6147,
  lon: 0.6268,
  imatge: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEQ5UlFOlHEjxBmrhKho4i03Ca-MkdGU8NDY3_0H37Ow&s=10"
 },
 {
  nom: "Museu de Lleida",
  lat: 41.6139,
  lon: 0.6209,
  imatge: "https://cultura.paeria.cat/ca/equipaments/museu-de-lleida/@@images/image/large"
 },
 {
  nom: "Centre d'Art La Panera",
  lat: 41.6171,
  lon: 0.6224,
  imatge: "https://upload.wikimedia.org/wikipedia/commons/b/bd/LaPanera_Lleida_Nov2009.jpg"
 },
 {
  nom: "Museu de l'Automoció Roda Roda",
  lat: 41.6133,
  lon: 0.6328,
  imatge: "https://www.paeria.cat/ca/ciutat/directori/museu-de-lautomocio-roda-roda/@@images/image/large"
 },
 {
  nom: "Camps Elisis",
  lat: 41.6141,
  lon: 0.6300,
  imatge: "https://upload.wikimedia.org/wikipedia/commons/b/b4/Entrada_al_parque.jpg"
 }
];

let model = null;
let stream = null;
let gps = null;
let escanejant = false;
let ocupat = false;

// CARREGAR MODEL

async function carregarModel() {
  try {
    model = await mobilenet.load();
    document.getElementById("estat").innerText =
      "Model preparat. Pots iniciar l'escàner.";
  } catch(e) {
    document.getElementById("estat").innerText =
      "Error carregant el model d'IA.";
    console.error(e);
  }
}

// CARREGAR IMATGES DE REFERÈNCIA

async function carregarImatges() {
  for (const lloc of llocs) {
    try {
      const img = new Image();
      img.crossOrigin = "anonymous";

      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
        img.src = lloc.imatge;
      });

      lloc.foto = img;
      lloc.caracteristiques =
        model.infer(img, true).dataSync().slice();

      const t = model.infer(img, true);
      t.dispose();

    } catch(e) {
      console.warn("No s'ha pogut carregar:", lloc.nom, e);
    }
  }
}

// DISTÀNCIA GPS EN METRES

function distancia(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const rad = x => x * Math.PI / 180;

  const dLat = rad(lat2-lat1);
  const dLon = rad(lon2-lon1);

  const a =
    Math.sin(dLat/2)**2 +
    Math.cos(rad(lat1)) *
    Math.cos(rad(lat2)) *
    Math.sin(dLon/2)**2;

  return R * 2 * Math.atan2(
    Math.sqrt(a), Math.sqrt(1-a)
  );
}

// OBTENIR GPS

function iniciarGPS() {
  if (!navigator.geolocation) return;

  navigator.geolocation.watchPosition(
    p => {
      gps = {
        lat: p.coords.latitude,
        lon: p.coords.longitude
      };
    },
    e => console.warn("GPS:", e.message),
    { enableHighAccuracy: true, maximumAge: 1000 }
  );
}

// COMPARAR IMATGES

function similitud(a, b) {
  let producte = 0;
  let normaA = 0;
  let normaB = 0;

  for (let i = 0; i < a.length; i++) {
    producte += a[i] * b[i];
    normaA += a[i] * a[i];
    normaB += b[i] * b[i];
  }

  return producte /
    (Math.sqrt(normaA * normaB) || 1);
}

// IDENTIFICAR MONUMENT

async function escanejar() {
  if (!escanejant || ocupat || video.readyState < 2) return;

  ocupat = true;

  try {
    const tensor = model.infer(video, true);
    const caracteristiques = tensor.dataSync().slice();
    tensor.dispose();

    let millor = null;
    let millorPuntuacio = -Infinity;

    llocs.forEach(lloc => {
      if (!lloc.caracteristiques) return;

      const score = similitud(
        caracteristiques,
        lloc.caracteristiques
      );

      if (score > millorPuntuacio) {
        millorPuntuacio = score;
        millor = lloc;
      }
    });

    let llocGPS = null;
    let distanciaGPS = null;

    if (gps) {
      const distancies = llocs.map(lloc => ({
        lloc,
        metres: distancia(
          gps.lat, gps.lon, lloc.lat, lloc.lon
        )
      })).sort((a,b) => a.metres-b.metres);

      llocGPS = distancies[0].lloc;
      distanciaGPS = distancies[0].metres;
    }

    mostrarResultat(millor, millorPuntuacio,
                    llocGPS, distanciaGPS);

  } catch(e) {
    console.error(e);
  }

  ocupat = false;

  if (escanejant) {
    setTimeout(escanejar, 1200);
  }
}

// MOSTRAR RESULTAT

function mostrarResultat(visual, score, gpsLloc, metres) {
  let candidat = visual;
  let text = "Comparació visual experimental";

  // Si som molt a prop d'un monument,
  // la ubicació GPS ajuda a identificar-lo.

  if (gpsLloc && metres < 100) {
    candidat = gpsLloc;
    text = "Identificació basada en la proximitat GPS";
  }

  if (!candidat) {
    document.getElementById("nom").innerText =
      "No s'han pogut comparar les imatges.";
    return;
  }

  document.getElementById("nom").innerText =
    "📍 " + candidat.nom;

  const img = document.getElementById("referencia");
  img.src = candidat.imatge;
  img.hidden = false;

  document.getElementById("distancia").innerText =
    gpsLloc
      ? "Distància al lloc més proper: " +
        Math.round(metres) + " metres (" +
        gpsLloc.nom + ")"
      : "Esperant senyal GPS...";

  document.getElementById("similitud").innerText =
    text + " · Puntuació visual: " +
    (score * 100).toFixed(1) + "% (no és una probabilitat)";
}

// INICIAR CÀMERA

async function iniciar() {
  try {
    if (!model) {
      alert("El model encara s'està carregant.");
      return;
    }

    document.getElementById("estat").innerText =
      "Preparant càmera i GPS...";

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    iniciarGPS();

    escanejant = true;

    document.getElementById("estat").innerText =
      "Escanejant monuments de Lleida...";

    escanejar();

  } catch(e) {
    console.error(e);
    document.getElementById("estat").innerText =
      "No s'ha pogut obrir la càmera o iniciar el GPS.";
  }
}

// ATURAR

function aturar() {
  escanejant = false;

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  video.srcObject = null;

  document.getElementById("estat").innerText =
    "Escàner aturat.";
}

async function iniciarAplicacio() {
  await carregarModel();
  if (model) await carregarImatges();
}

iniciarAplicacio();

</script>
</body>
</html>
